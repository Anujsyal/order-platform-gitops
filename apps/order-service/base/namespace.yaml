apiVersion: v1
kind: Namespace
metadata:
  name: order-service
  labels:
    # Pod Security Admission: reject anything that isn't "restricted"-compliant
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    # Kyverno ClusterPolicies only target namespaces carrying this label
    policy.order-platform.io/enforce: "true"
