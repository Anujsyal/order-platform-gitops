apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Jenkins updates this block (kustomize edit set image) after the staging approval.
images:
  - name: order-service
    newName: docker.io/maverick8826/order-service
    newTag: "0.0.0"

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: order-service-config
    behavior: merge
    literals:
      - APP_ENV=staging

patches:
  - target:
      kind: Rollout
      name: order-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
