apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

# Jenkins updates this block (kustomize edit set image) on every promotion.
images:
- name: order-service
  newName: docker.io/maverick8826/order-service
  newTag: 6-5e0ae82

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
- behavior: merge
  literals:
  - APP_ENV=dev
  name: order-service-config

patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
  target:
    kind: Rollout
    name: order-service
