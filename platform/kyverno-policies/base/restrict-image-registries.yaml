apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict image registries
    policies.kyverno.io/description: Only images built by our pipeline (plus the pinned demo load generator) may run.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: validate-registries
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaceSelector:
                matchLabels:
                  policy.order-platform.io/enforce: "true"
      validate:
        message: "Images must come from docker.io/maverick8826/ (or curlimages/ for the traffic generator)."
        pattern:
          spec:
            containers:
              - image: "docker.io/maverick8826/* | curlimages/*"
